<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оставить заявку</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1c2230;--mut:#6b7280;--bd:#e3e6ec;--ac:#3b6cf6;--bad:#dc2626;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b1f2a;--tx:#e8ebf2;--mut:#9aa3b5;--bd:#2b3140;--ac:#6b93ff;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px;max-width:440px;width:100%}
h1{font-size:21px;margin:0 0 6px}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.steps{display:flex;gap:6px;margin:0 0 18px;font-size:12px;color:var(--mut)}
.steps span{flex:1;background:var(--bg);border-radius:8px;padding:6px 8px;text-align:center}
.steps b{color:var(--ac)}
label.l{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
input[type=text]{width:100%;padding:13px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input[type=text]:focus{outline:0;border-color:var(--ac)}
input.err{border-color:var(--bad)}
.h{font-size:13px;color:var(--mut);margin-top:4px}
.e{font-size:13px;color:var(--bad);margin-top:4px;min-height:0}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);margin-top:16px}
.ck input{margin-top:3px;width:18px;height:18px;flex:0 0 18px}
button,a.b{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.next{margin-top:18px;padding-top:14px;border-top:1px solid var(--bd);font-size:13px;color:var(--mut)}
.ok{font-size:44px;text-align:center}
</style>
</head>
<body>
<div class="c" id="c"></div>
<script>
const q=new URLSearchParams(location.search),A=q.get('a')||'',S=q.get('s')||'',P=q.get('p')||'',R=q.get('r')||'';
const H=q.get('h')||'Оставьте заявку — мы свяжемся и всё расскажем';
const uid=()=>Math.random().toString(36).slice(2,12);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function post(o){
  if(!/^https:\/\/script\.google\.com\//.test(A))return Promise.resolve();
  return fetch(A,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).catch(()=>{});
}
try{if(!sessionStorage.getItem('c')){sessionStorage.setItem('c','1');post({id:uid(),type:'click',source:S,partner:P})}}catch(e){}

function form(){
  $('c').innerHTML=`<h1>${esc(H)}</h1>
  <p class="sub">Это займёт меньше минуты. Нужно всего два поля.</p>
  <div class="steps"><span><b>1</b> Имя</span><span><b>2</b> Контакт</span><span><b>3</b> Готово</span></div>

  <label class="l" for="n">1. Как вас зовут?</label>
  <input type="text" id="n" autocomplete="name" placeholder="Например: Иван">
  <div class="h">Достаточно имени, фамилия не нужна.</div><div class="e" id="en"></div>

  <label class="l" for="t">2. Как с вами связаться?</label>
  <input type="text" id="t" autocomplete="tel" inputmode="text" placeholder="+7 900 123-45-67 или @username">
  <div class="h">Напишите номер телефона <b>или</b> ник в Telegram. Выберите то, что вам удобнее.</div><div class="e" id="et"></div>

  <label class="ck"><input type="checkbox" id="ok"><span>Я согласен(на), чтобы со мной связались по указанному контакту и обработали введённые данные только для этого.</span></label>
  <div class="e" id="eo"></div>

  <button id="b">Отправить заявку</button>
  <div class="next"><b>Что будет дальше?</b><br>Мы получим вашу заявку и свяжемся с вами по указанному контакту. Больше ничего делать не нужно.</div>`;
  ['n','t'].forEach(id=>$(id).oninput=()=>{$(id).classList.remove('err');$('e'+id).textContent=''});
  $('ok').onchange=()=>$('eo').textContent='';
  $('b').onclick=submit;
}
function bad(id,msg){const f=$(id);f.classList.add('err');$('e'+id).textContent=msg}
async function submit(){
  const n=$('n').value.trim(),t=$('t').value.trim();let okk=true;
  if(!n){bad('n','Введите, как вас зовут');okk=false}
  const digits=t.replace(/\D/g,'');
  if(!t){bad('t','Укажите телефон или ник в Telegram');okk=false}
  else if(!t.startsWith('@')&&!/[a-zа-я_]/i.test(t)&&digits.length<10){bad('t','В номере должно быть не меньше 10 цифр. Пример: +7 900 123-45-67');okk=false}
  if(!$('ok').checked){$('eo').textContent='Поставьте галочку, чтобы мы могли с вами связаться';okk=false}
  if(!okk)return;
  const b=$('b');b.disabled=true;b.textContent='Отправляем…';
  const tg=t.startsWith('@')||/[a-zа-я_]/i.test(t);
  await post({id:uid(),type:'lead',name:n,phone:tg?'':t,tg:tg?(t.startsWith('@')?t:'@'+t):'',source:S,partner:P});
  done();
}
function done(){
  $('c').innerHTML=`<div class="ok">✅</div><h1 style="text-align:center">Заявка отправлена!</h1>
  <p class="sub" style="text-align:center">Спасибо. Мы свяжемся с вами по указанному контакту.</p>`+
    (/^https?:\/\//.test(R)?`<a class="b" href="${esc(R)}" rel="noopener">Перейти к предложению</a>`:'');
}
form();
</script>
</body>
</html>

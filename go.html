<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оставить заявку</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1c2230;--mut:#6b7280;--bd:#e3e6ec;--ac:#3b6cf6}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b1f2a;--tx:#e8ebf2;--mut:#9aa3b5;--bd:#2b3140;--ac:#6b93ff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;max-width:420px;width:100%}
h1{font-size:20px;margin:0 0 14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text]{width:100%;padding:11px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mut);margin-top:12px}
button,a.b{display:block;width:100%;margin-top:14px;padding:12px;border:0;border-radius:9px;background:var(--ac);color:#fff;font:inherit;text-align:center;text-decoration:none;cursor:pointer}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="c" id="c"></div>
<script>
const q=new URLSearchParams(location.search),A=q.get('a')||'',S=q.get('s')||'',P=q.get('p')||'',R=q.get('r')||'';
const H=q.get('h')||'Оставьте контакт — мы свяжемся и расскажем подробности';
const uid=()=>Math.random().toString(36).slice(2,12);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function post(o){
  if(!/^https:\/\/script\.google\.com\//.test(A))return Promise.resolve();
  return fetch(A,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).catch(()=>{});
}
try{if(!sessionStorage.getItem('c')){sessionStorage.setItem('c','1');post({id:uid(),type:'click',source:S,partner:P})}}catch(e){}
function form(){
  document.getElementById('c').innerHTML=`<h1>${esc(H)}</h1>
  <label>Как вас зовут</label><input type="text" id="n" autocomplete="name" placeholder="Например: Иван"><div class="mut">Достаточно имени.</div>
  <label>Как с вами связаться</label><input type="text" id="t" autocomplete="tel" placeholder="+7 900 123-45-67 или @username"><div class="mut">Укажите телефон или ник в Telegram — как вам удобнее.</div>
  <label class="ck"><input type="checkbox" id="ok"> Согласен(на), что со мной свяжутся по указанному контакту и обработают введённые данные для этой цели</label>
  <button id="b">Отправить заявку</button><p class="mut" id="e"></p>`;
  document.getElementById('b').onclick=async()=>{
    const n=document.getElementById('n').value.trim(),t=document.getElementById('t').value.trim(),e=document.getElementById('e');
    if(!n||!t)return e.textContent='Заполните имя и контакт';
    if(!document.getElementById('ok').checked)return e.textContent='Нужно согласие на связь';
    const tg=/[a-zа-я@_]/i.test(t);
    await post({id:uid(),type:'lead',name:n,phone:tg?'':t,tg:tg?t:'',source:S,partner:P});
    done();
  };
}
function done(){
  document.getElementById('c').innerHTML=`<h1>Спасибо!</h1><p class="mut">Заявка отправлена, с вами свяжутся.</p>`+
    (/^https?:\/\//.test(R)?`<a class="b" href="${esc(R)}" rel="noopener">Перейти к предложению</a>`:'');
}
form();
</script>
</body>
</html>
